name: VKMT CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vkmt-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck zsh

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            if head -n 1 "$file" | grep -q '/zsh'; then
              zsh -n "$file"
            else
              bash -n "$file"
            fi
          done < <(git ls-files '*.sh')

      - name: Run ShellCheck on Bash sources
        shell: bash
        run: |
          set -euo pipefail
          bash_files=()
          while IFS= read -r file; do
            if ! head -n 1 "$file" | grep -q '/zsh'; then
              bash_files+=("$file")
            fi
          done < <(git ls-files '*.sh')
          shellcheck -S error "${bash_files[@]}"

  python:
    name: Python compile and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python tooling
        run: python -m pip install --disable-pip-version-check ruff==0.16.3

      - name: Compile Python sources
        run: python -m compileall -q scripts tools test/steam

      - name: Run Ruff
        run: ruff check scripts tools test/steam

  rust:
    name: Rust check, format, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/steam-handoff-backend
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

  cmake:
    name: CMake configure, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S ci/cmake -B "$RUNNER_TEMP/vkmt-cmake-build" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$RUNNER_TEMP/vkmt-cmake-build" --parallel

      - name: Test
        run: ctest --test-dir "$RUNNER_TEMP/vkmt-cmake-build" --output-on-failure

  java:
    name: Java compile and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java sources
        run: javac -Xlint:all -Werror -d "$RUNNER_TEMP/vkmt-java-classes" ci/java/VkmtCiSmoke.java

      - name: Run Java smoke test
        run: java -cp "$RUNNER_TEMP/vkmt-java-classes" VkmtCiSmoke
