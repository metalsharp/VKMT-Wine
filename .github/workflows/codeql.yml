name: CodeQL security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: C/C++
            language: c-cpp
            build-mode: manual
          - name: Java
            language: java-kotlin
            build-mode: manual
          - name: Rust
            language: rust
            # The current Rust extractor supports source-only analysis.
            build-mode: none
          - name: Python
            language: python
            build-mode: none
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build C/C++ smoke target
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S ci/cmake -B "$RUNNER_TEMP/vkmt-codeql-cmake" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/vkmt-codeql-cmake" --parallel

      - name: Build Java smoke target
        if: matrix.language == 'java-kotlin'
        run: javac -Xlint:all -Werror -d "$RUNNER_TEMP/vkmt-codeql-java" ci/java/VkmtCiSmoke.java

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  shell:
    # CodeQL has no shell extractor. ShellCheck is the security/static analysis
    # gate for the repository's Bash and Zsh sources.
    name: Shell security (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck zsh

      - name: Validate shell syntax and run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          bash_files=()
          while IFS= read -r file; do
            if head -n 1 "$file" | grep -q '/zsh'; then
              zsh -n "$file"
            else
              bash -n "$file"
              bash_files+=("$file")
            fi
          done < <(git ls-files '*.sh')
          shellcheck -S error "${bash_files[@]}"
