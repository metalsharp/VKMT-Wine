# VKMT's default DXMT profile.
#
# DXMT reads this file through DXMT_CONFIG_FILE.  Keep the spelling used by
# DXMT's configuration parser (preferredMaxFrameRate); the historical
# "preffered" spelling is not a recognized option.
dxmt.metalShaderVersion = 310
d3d11.maxFeatureLevel = 12_1
d3d11.metalSpatialUpscaleFactor = 2.0
d3d11.preferredMaxFrameRate = 60
